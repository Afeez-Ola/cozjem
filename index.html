<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Familjen+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: kitchen counter. Left = fridge + goal, right = Today / Week tabs, below = eating habits for the chosen goal. Stacks on phones. */
:root{
  --bg:#EDF1EB; --surface:#FBFCFA; --ink:#1E2420; --muted:#5E6A61; --line:#D3DBD2;
  --beet:#8A1E4C; --beet-soft:#F3E1E8; --dill:#3D7A3A; --dill-soft:#DDEDD9; --paper:#FFFFFF; --paper-ink:#2A2A2A;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141916; --surface:#1C231F; --ink:#E7ECE6; --muted:#9AA79D; --line:#2E3832;
  --beet:#E07AA5; --beet-soft:#3A1F2B; --dill:#8FCB86; --dill-soft:#22351F; --paper:#F4F2EC; --paper-ink:#232323; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --surface:#1C231F; --ink:#E7ECE6; --muted:#9AA79D; --line:#2E3832;
  --beet:#E07AA5; --beet-soft:#3A1F2B; --dill:#8FCB86; --dill-soft:#22351F; --paper:#F4F2EC; --paper-ink:#232323; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1160px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0;letter-spacing:-.02em}
.brand h1 span{color:var(--beet)}
.brand p{margin:.4rem 0 0;color:var(--muted);max-width:50ch;text-wrap:pretty}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;color:var(--ink);font:600 .95rem var(--f-body);padding:.5rem 1rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.label{font:600 .75rem var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button,.stores button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:.55rem .4rem;font:600 .92rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--beet);border-color:var(--beet);color:var(--surface)}
.seg.goal{grid-template-columns:repeat(2,1fr)}
.seg.goal button[aria-pressed="true"]{background:var(--dill);border-color:var(--dill)}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:420px){.stores{grid-template-columns:repeat(2,1fr)}}
.stores button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:.55rem .75rem;font:inherit}
.linkbtn{border:0;background:none;color:var(--muted);font:500 .85rem var(--f-body);text-decoration:underline;cursor:pointer;padding:.3rem}
.cat{display:flex;flex-direction:column;gap:6px}
.cat h3{margin:0;font:600 .8rem var(--f-body);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.32rem .7rem;font:500 .88rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.chip::before{content:"";width:.55rem;height:.55rem;border-radius:50%;border:1.5px solid var(--muted)}
.chip[aria-pressed="true"]{background:var(--dill-soft);border-color:var(--dill)}
.chip[aria-pressed="true"]::before{background:var(--dill);border-color:var(--dill)}
.basics{font-size:.85rem;color:var(--muted);margin:0}
.go{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:.85rem 1rem;font:700 1.05rem var(--f-display);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--beet);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 0}
.tabs button{border:0;background:none;color:var(--muted);font:700 1.05rem var(--f-display);padding:.4rem .8rem .6rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--beet)}
.result{gap:18px}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--beet)}30%{box-shadow:0 0 0 4px var(--beet-soft)}100%{box-shadow:0 0 0 0 transparent}}
.dish-top{display:flex;flex-direction:column;gap:6px}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:.2rem .5rem;border-radius:6px;background:var(--beet-soft);color:var(--beet)}
.tag.plain{background:var(--bg);color:var(--muted)}
.tag.good{background:var(--dill-soft);color:var(--dill)}
.dish-top h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.5vw,2.7rem);line-height:1.02;margin:4px 0 0;letter-spacing:-.015em;text-wrap:balance}
.meter{display:flex;align-items:center;gap:10px;font-size:.9rem}
.bar{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--dill);border-radius:99px;transition:width .4s ease}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:560px){.cols{grid-template-columns:minmax(0,1fr)}}
.have ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.have li{display:flex;gap:8px}
.have li b{color:var(--dill);font-weight:600}
.have li.miss b{color:var(--beet)}
ol.steps{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:8px}
ol.steps li{padding-left:.2rem;max-width:62ch}
ol.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--beet)}

.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:.82rem;padding:16px 16px 22px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 20px -12px rgba(0,0,0,.35);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 9px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 9px repeat-x}
.receipt .rh{text-align:center;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.receipt .rs{text-align:center;opacity:.7;margin-bottom:8px}
.receipt hr{border:0;border-top:1px dashed #9a9a9a;margin:8px 0}
.receipt .row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.receipt .tot{font-weight:600;font-size:.95rem}
.receipt .note{opacity:.7;font-size:.72rem;margin-top:8px;line-height:1.4}
.receipt .done{text-align:center;padding:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:.55rem .85rem;font:600 .9rem var(--f-body);cursor:pointer}
.btn.primary{background:var(--beet);border-color:var(--beet);color:var(--surface)}
.alts{display:flex;flex-direction:column;gap:6px}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.55rem .75rem;cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.alt small{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted)}

/* week planner */
.week{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:5.5rem repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.whead{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 .2rem}
.wday{display:flex;flex-direction:column;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.1}
.wday small{font:500 .72rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.cell{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem 1.8rem .45rem .55rem;min-width:0;display:flex;flex-direction:column;gap:2px}
.cell button.open{border:0;background:none;padding:0;text-align:left;color:var(--ink);font:600 .85rem/1.25 var(--f-body);cursor:pointer}
.cell button.open:hover{text-decoration:underline}
.cell small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.cell .miss{color:var(--beet)}
.cell button.swap{position:absolute;top:4px;right:4px;width:1.5rem;height:1.5rem;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;line-height:1}
.cell button.swap:hover{background:var(--surface);color:var(--ink)}
@media (max-width:620px){
  .wrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wrow.head{display:none}
  .wday{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:8px;margin-top:6px}
  .cell::before{content:attr(data-m);font:600 .65rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
}
.weekfoot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:620px){.weekfoot{grid-template-columns:minmax(0,1fr)}}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}

/* habits */
.habits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px}
@media (max-width:760px){.habits{grid-template-columns:minmax(0,1fr)}}
.habits h2{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.habits p{margin:0;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
@media (max-width:560px){.tips{grid-template-columns:minmax(0,1fr)}}
.tips li{border-top:2px solid var(--dill);padding-top:8px}
.tips li b{display:block;margin-bottom:2px}
.tips li span{color:var(--muted);font-size:.93rem}
.disc{font-size:.8rem;color:var(--muted);margin-top:12px}
footer{color:var(--muted);font-size:.8rem;max-width:80ch}

/* finished dish illustration */
.dish-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);gap:16px;align-items:center}
@media (max-width:560px){.dish-hero{grid-template-columns:minmax(0,1fr)}.art{max-width:240px;justify-self:center}}
.art{width:100%;height:auto;overflow:visible}
.art .ves{animation:drop .55s cubic-bezier(.2,.9,.3,1.2) both}
.art .shad{animation:shad .55s ease both}
.art .food{animation:fill .5s .25s cubic-bezier(.2,.9,.3,1.3) both}
.art .gar{animation:pop2 .35s var(--d) cubic-bezier(.2,.9,.3,1.6) both}
.art .st{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;opacity:0;animation:steam2 2.8s var(--d) ease-in-out infinite}
@keyframes drop{from{transform:translateY(-26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shad{from{transform:scaleX(.5);opacity:.2}to{transform:none;opacity:1}}
@keyframes fill{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes steam2{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
.art .shad{transform-origin:120px 134px}
a.img{font-size:.78rem;color:var(--beet);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.receipt .rsub{text-align:center;margin:8px 0 4px;opacity:.75;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem}

.have li{align-items:flex-start}
.hv{flex:none;width:20px;height:20px;margin-top:1px;border-radius:5px;border:2px solid var(--beet);background:var(--surface);color:var(--surface);font:700 .75rem/1 var(--f-body);cursor:pointer;display:grid;place-items:center;padding:0}
.hv[aria-pressed="true"]{background:var(--dill);border-color:var(--dill)}
.hint{margin:-4px 0 8px;font-size:.8rem;color:var(--muted)}
.still .art .ves,.still .art .shad,.still .art .food,.still .art .gar,.still>*{animation:none!important}
/* cook with what I have */
.cookwith{display:flex;flex-direction:column;gap:10px;padding:14px;margin:-6px -6px 0;border-radius:12px;background:var(--dill-soft)}
.cookwith .label{margin:0}
.cookwith .search input{background:var(--surface)}
.go.sug{background:var(--dill);color:var(--surface)}
.chip.mine{background:var(--surface);border-color:var(--dill);padding-right:.35rem}
.chip.mine::before{background:var(--dill);border-color:var(--dill)}
.chip.mine .x{display:inline-grid;place-items:center;width:1.1rem;height:1.1rem;border-radius:50%;color:var(--muted);font-size:.85rem;line-height:1}
.chip.mine:hover .x{background:var(--beet-soft);color:var(--beet)}
.chip.mine.free{border-style:dashed}
.sugh{display:flex;flex-direction:column;gap:4px}
.sugh h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.05;margin:0;text-wrap:balance}
.sugh p{margin:0;color:var(--muted);font-size:.92rem}
.thinking{display:flex;align-items:center;gap:12px;padding:16px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
.thinking .pot{width:38px;height:38px;flex:none}
.thinking .pot .lid{animation:lid 1s ease-in-out infinite;transform-origin:20px 14px}
@keyframes lid{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-6deg)}}
.thinking span{flex:1;color:var(--muted)}
.ainote{font-size:.78rem;color:var(--muted);margin:0}
.notice{padding:12px 14px;border-radius:10px;background:var(--beet-soft);color:var(--ink);font-size:.9rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.alt .uses{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
/* bookmarks */
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:4px}
.titlerow h2{margin:0!important}
.bm{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.4rem .75rem .4rem .55rem;font:600 .85rem var(--f-body);cursor:pointer;transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
.bm svg{width:16px;height:16px}
.bm svg path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .2s ease}
.bm:hover{border-color:var(--beet)}
.bm[aria-pressed="true"]{border-color:var(--beet);background:var(--beet-soft);color:var(--beet)}
.bm[aria-pressed="true"] svg path{fill:currentColor}
.bm.pop svg{animation:bmpop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes bmpop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap}
@media (max-width:480px){.tabs button{padding:.4rem .55rem .6rem;font-size:.95rem}}
.tcount{display:inline-grid;place-items:center;min-width:1.3rem;height:1.3rem;padding:0 .3rem;border-radius:99px;background:var(--beet);color:var(--surface);font:700 .72rem var(--f-body);vertical-align:2px}
.savedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-width:0}
.scard .art{max-width:150px;align-self:center}
.scard h3{margin:0;font:700 1.1rem/1.15 var(--f-display);text-wrap:balance}
.scard .eyebrow .tag{font-size:.64rem}
.scard small{color:var(--muted);font-size:.78rem}
.scard .actions{margin-top:auto}
/* shared-meal landing card */
.landing{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lback{position:absolute;inset:0;background:var(--ink);opacity:.55;animation:fadein .25s ease both}
.lcard{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:20px;padding:22px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:cardup .45s cubic-bezier(.2,.9,.3,1.15) both}
.lkick{margin:0;font:600 .75rem var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--beet)}
.lart{width:min(300px,80%);margin:-4px 0 -6px}
.lcard h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.05;margin:0;text-wrap:balance}
.lmeta{justify-content:center}
.lhave{margin:0;color:var(--muted);font-size:.92rem}
.lbtns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
.lbtns .go{width:100%}
.lrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.landing.out .lcard{animation:carddown .22s ease both}
.landing.out .lback{animation:fadeout .22s ease both}
@keyframes cardup{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes carddown{to{opacity:0;transform:translateY(30px) scale(.97)}}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
/* ---- app layout redesign ---- */
main{display:block!important;width:100%;max-width:1000px;margin:0 auto}
.appnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:1000px;width:100%;margin:0 auto;box-shadow:0 6px 18px -14px rgba(0,0,0,.4)}
.appnav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;color:var(--muted);font:600 .95rem var(--f-body);padding:.6rem .5rem;border-radius:12px;cursor:pointer;position:relative;transition:background-color .15s ease,color .15s ease}

  sp:["Zetrzyj 1 kg ziemniaków i cebulę na drobnej tarce.","Odlej nadmiar wody.","Dodaj jajko, 2 łyżki mąki i sól.","Smaż cienkie placki na oleju na złoto.","Podawaj ze śmietaną."],
  se:["Finely grate 1 kg potatoes and an onion.","Drain off the excess liquid.","Mix in an egg, 2 spoons of flour and salt.","Fry thin pancakes in oil until golden.","Serve with sour cream."]},
 {id:"pierogi",k:650,p:22,pl:"Pierogi ruskie",en:"Pierogi with potato and cheese",o:"pl",m:"l",t:75,s:4,n:["maka","ziemniaki","twarog","cebula"],
  sp:["Ugotuj i rozgnieć 600 g ziemniaków.","Wymieszaj z twarogiem i podsmażoną połową cebuli, dopraw pieprzem.","Zagnieć ciasto z 500 g mąki, szklanki ciepłej wody i łyżki oleju.","Rozwałkuj, wykrawaj krążki, nakładaj farsz i sklejaj.","Gotuj w osolonej wodzie 2 minuty od wypłynięcia. Polej resztą smażonej cebuli."],
  se:["Boil and mash 600 g potatoes.","Mix with quark and half the onion, fried. Season with pepper.","Knead a dough from 500 g flour, a cup of warm water and a spoon of oil.","Roll out, cut circles, fill and pinch shut.","Boil in salted water for 2 minutes after they float. Top with the rest of the fried onion."]},
 {id:"bolognese",k:650,p:33,pl:"Spaghetti bolognese",en:"Spaghetti bolognese",o:"it",m:"ld",t:40,s:4,n:["makaron","mielone","passata","cebula","czosnek","marchew","grana"],
  sp:["Podsmaż drobno pokrojoną cebulę, marchew i czosnek.","Dodaj mięso mielone i smaż, aż się zrumieni.","Wlej passatę i duś 20 minut.","Ugotuj makaron al dente.","Wymieszaj z sosem i posyp tartym serem Grana."],
  se:["Gently fry finely chopped onion, carrot and garlic.","Add the minced meat and brown it.","Pour in the passata and simmer 20 minutes.","Cook the pasta al dente.","Toss with the sauce and top with grated Grana."]},
 {id:"leczo",k:450,p:18,pl:"Leczo z kiełbasą",en:"Lecsó with sausage",o:"hu",m:"ld",t:35,s:4,n:["kielbasa","papryka","cukinia","cebula","passata","ppapryka"],
  sp:["Podsmaż pokrojoną kiełbasę i cebulę.","Dodaj paprykę i cukinię w kostkę.","Wsyp łyżeczkę słodkiej papryki.","Wlej passatę i duś 20 minut.","Podawaj z chlebem lub ryżem."],
  se:["Fry sliced kiełbasa and onion.","Add diced peppers and courgette.","Stir in a teaspoon of sweet paprika.","Add the passata and simmer 20 minutes.","Serve with bread or rice."]},
 {id:"bigos",k:480,p:22,pl:"Bigos",en:"Bigos hunter's stew",o:"pl",m:"l",t:120,s:6,n:["kwaszona","kapusta","kielbasa","boczek","pieczarki","cebula","passata","ziele","majeranek"],
  sp:["Duś kapustę kiszoną z liściem laurowym i zielem angielskim przez 40 minut.","Poszatkuj białą kapustę i dodaj do garnka.","Podsmaż boczek, kiełbasę, cebulę i pieczarki, przełóż do kapusty.","Dodaj passatę i majeranek.","Duś na małym ogniu jeszcze godzinę. Dzień później smakuje lepiej."],
  se:["Simmer the sauerkraut with bay leaf and allspice for 40 minutes.","Shred the white cabbage and add it.","Fry bacon, kiełbasa, onion and mushrooms, then add to the pot.","Stir in passata and marjoram.","Cook low for another hour. It tastes better the next day."]},
 {id:"risotto",k:520,p:14,pl:"Risotto z pieczarkami",en:"Mushroom risotto",o:"it",m:"ld",t:35,s:3,n:["ryz","pieczarki","cebula","czosnek","bulion","maslo","grana"],
  sp:["Przygotuj 1 l gorącego bulionu.","Zeszklij cebulę i czosnek na maśle, dodaj pokrojone pieczarki.","Wsyp 1,5 szklanki ryżu i mieszaj minutę.","Dolewaj bulion chochlą, mieszając, przez 18 minut.","Na koniec dodaj masło i tarty ser Grana."],
  se:["Heat 1 l of stock.","Soften onion and garlic in butter, add sliced mushrooms.","Add 1.5 cups of rice and stir for a minute.","Add stock a ladle at a time, stirring, for 18 minutes.","Finish with butter and grated Grana."]},
 {id:"krupnik",k:360,p:28,pl:"Krupnik z kurczakiem",en:"Krupnik barley soup",o:"pl",m:"l",t:50,s:4,n:["kasza","ziemniaki","marchew","pietruszka","kurczak","natka"],
  sp:["Gotuj kurczaka w 1,5 l osolonej wody 20 minut.","Dodaj marchew i pietruszkę w kostkę.","Wsyp pół szklanki kaszy i ziemniaki.","Gotuj, aż wszystko zmięknie, około 20 minut.","Pokrój mięso, wróć do zupy i posyp natką."],
  se:["Simmer the chicken in 1.5 l salted water for 20 minutes.","Add diced carrot and parsley root.","Add half a cup of barley and the potatoes.","Cook until tender, about 20 minutes.","Shred the chicken back in and finish with parsley."]},
 {id:"grecka",k:330,p:12,pl:"Sałatka grecka",en:"Greek salad",o:"gr",m:"ld",t:10,s:2,n:["pomidory","ogorek","papryka","cebula","feta","oliwki"],
  sp:["Pokrój pomidory, ogórek i paprykę w kostkę.","Dodaj cienkie piórka cebuli i oliwki.","Połóż na wierzchu ser feta.","Skrop olejem lub oliwą, dopraw solą i pieprzem."],
  se:["Chop the tomatoes, cucumber and pepper.","Add thinly sliced onion and the olives.","Top with feta.","Dress with oil, salt and pepper."]},
 {id:"tunczyk",k:320,p:32,pl:"Sałatka z tuńczykiem i jajkiem",en:"Tuna and egg salad",o:"eu",m:"ld",t:15,s:2,n:["tunczyk","jajka","pomidory","ogorek","cebula"],
  sp:["Ugotuj 3 jajka na twardo, około 9 minut.","Pokrój pomidory, ogórek i odrobinę cebuli.","Dodaj odsączonego tuńczyka i ćwiartki jajek.","Skrop olejem, dopraw solą i pieprzem."],
  se:["Hard boil 3 eggs, about 9 minutes.","Chop the tomatoes, cucumber and a little onion.","Add the drained tuna and quartered eggs.","Dress with oil, salt and pepper."]},
 {id:"nalesniki",k:550,p:25,pl:"Naleśniki z twarogiem",en:"Crepes with sweet quark",o:"pl",m:"bd",t:30,s:3,n:["maka","mleko","jajka","twarog","cukier","smietana"],
  sp:["Zmiksuj szklankę mąki, szklankę mleka, pół szklanki wody, 2 jajka i szczyptę soli.","Smaż cienkie naleśniki na lekko natłuszczonej patelni.","Twaróg wymieszaj z cukrem i łyżką śmietany.","Nałóż farsz, zwiń w rulony lub trójkąty."],
  se:["Blend a cup of flour, a cup of milk, half a cup of water, 2 eggs and a pinch of salt.","Fry thin crepes in a lightly oiled pan.","Mix the quark with sugar and a spoon of sour cream.","Fill and roll or fold into triangles."]},
 {id:"zapiekanka",k:600,p:22,pl:"Zapiekanka z pieczarkami",en:"Zapiekanka open baguette",o:"pl",m:"d",t:25,s:2,n:["bagietka","pieczarki","cebula","ser","maslo","ketchup"],
  sp:["Podsmaż pokrojone pieczarki z cebulą na maśle, dopraw solą.","Przekrój bagietkę wzdłuż.","Nałóż pieczarki i ser żółty.","Zapiekaj w 200°C przez 10 minut.","Polej ketchupem i podawaj na gorąco."],
  se:["Fry sliced mushrooms and onion in butter, season with salt.","Split the baguette lengthwise.","Top with the mushrooms and cheese.","Bake at 200°C for 10 minutes.","Finish with ketchup and eat hot."]},
 {id:"pesto",k:600,p:18,pl:"Makaron z pesto i pomidorami",en:"Pesto pasta with tomatoes",o:"it",m:"ld",t:15,s:2,n:["makaron","pesto","pomidory","grana"],
  sp:["Ugotuj makaron w osolonej wodzie.","Pokrój pomidory.","Odcedź makaron, zostaw trochę wody.","Wymieszaj z pesto, pomidorami i odrobiną wody z gotowania.","Posyp tartym serem Grana."],
  se:["Cook the pasta in salted water.","Chop the tomatoes.","Drain, keeping a splash of the water.","Toss with pesto, tomatoes and the pasta water.","Top with grated Grana."]}
,
 {id:"jollof",k:620,p:35,pl:"Jollof z kurczakiem",en:"Jollof rice with chicken",o:"wa",m:"ld",t:50,s:4,n:["ryz","passata","papryka","cebula","chili","bulion","kurczak","curry"],
  sp:["Zmiksuj paprykę, połowę cebuli, chili i passatę na gładki sos.","Podsmaż kurczaka w kawałkach i resztę cebuli na oleju, wyjmij kurczaka.","Wlej sos, dodaj curry, tymianek i kostkę bulionu, smaż 10 minut, aż zgęstnieje.","Wsyp 2 szklanki opłukanego ryżu i 2 szklanki wody, przykryj szczelnie.","Gotuj na małym ogniu 25 minut, w połowie dołóż kurczaka. Nie mieszaj za często."],
  se:["Blend the peppers, half the onion, chilli and passata into a smooth sauce.","Brown the chicken pieces and the rest of the onion in oil, then lift out the chicken.","Add the sauce, curry, thyme and a stock cube and fry 10 minutes until thick.","Add 2 cups of rinsed rice and 2 cups of water and cover tightly.","Cook on low for 25 minutes, returning the chicken halfway. Stir as little as possible."]},
 {id:"egusi",k:720,p:38,pl:"Zupa egusi z eba",en:"Egusi soup with eba",o:"ng",m:"l",t:60,s:4,n:["egusi","palmowy","szpinak","wolowina","cebula","chili","bulion","garri"],
  sp:["Ugotuj wołowinę z cebulą i kostką bulionu do miękkości, około 40 minut.","Rozgrzej 4 łyżki oleju palmowego, dodaj zmiksowane chili i cebulę.","Wmieszaj egusi z odrobiną wody i smaż, aż powstaną grudki, około 10 minut.","Dolej wywar z mięsem, a na koniec szpinak, gotuj 5 minut.","Eba: zalej garri wrzątkiem i ugniataj na gładką masę. Podawaj z zupą."],
  se:["Simmer the beef with onion and a stock cube until tender, about 40 minutes.","Heat 4 spoons of palm oil and add blended chilli and onion.","Stir in the egusi with a splash of water and fry until it clumps, about 10 minutes.","Add the meat and stock, then the spinach, and cook 5 minutes.","Eba: pour boiling water over garri and stir into a smooth dough. Serve with the soup."]},
 {id:"dodo",k:480,p:16,pl:"Dodo z jajkami",en:"Dodo and eggs",o:"ng",m:"bd",t:15,s:2,n:["plantan","jajka","pomidory","cebula","chili"],
  sp:["Obierz dojrzałe plantany i pokrój ukośnie w plastry.","Smaż na oleju na złoto z obu stron.","Na drugiej patelni podsmaż cebulę, pomidory i chili.","Wbij jajka i mieszaj, aż się zetną.","Podawaj jajka obok smażonego plantana."],
  se:["Peel ripe plantains and slice them on the diagonal.","Fry in oil until golden on both sides.","In another pan fry onion, tomato and chilli.","Add the eggs and scramble until set.","Serve the eggs next to the fried plantain."]},
 {id:"akara",k:350,p:14,pl:"Akara (placuszki z fasoli)",en:"Akara bean fritters",o:"ng",m:"bd",t:40,s:3,n:["fasolaoko","cebula","chili"],
  sp:["Namocz 2 szklanki fasoli na noc i zetrzyj skórki, płucząc w wodzie.","Zmiksuj fasolę z cebulą, chili i odrobiną wody na gęstą pastę.","Ubijaj łyżką 2 minuty, żeby ciasto było puszyste, dopraw solą.","Smaż łyżką małe kulki w głębokim oleju na złoto."],
  se:["Soak 2 cups of beans overnight and rub off the skins while rinsing.","Blend the beans with onion, chilli and a little water into a thick paste.","Whisk with a spoon for 2 minutes to make it fluffy, then salt it.","Drop spoonfuls into deep oil and fry until golden."]},
 {id:"redred",k:560,p:18,pl:"Red red z plantanem",en:"Red red with plantain",o:"gh",m:"ld",t:45,s:4,n:["fasolaoko","palmowy","cebula","pomidory","chili","plantan"],
  sp:["Ugotuj namoczoną fasolę do miękkości, około 30 minut.","Na oleju palmowym podsmaż cebulę, chili i pomidory na gęsty sos.","Dodaj fasolę, dopraw solą i duś 10 minut.","Podawaj ze smażonym plantanem."],
  se:["Boil the soaked beans until soft, about 30 minutes.","Fry onion, chilli and tomatoes in palm oil into a thick sauce.","Add the beans, salt and simmer 10 minutes.","Serve with fried plantain."]},
 {id:"maafe",k:680,p:38,pl:"Maafe, gulasz orzechowy",en:"Maafe peanut stew",o:"sn",m:"ld",t:50,s:4,n:["kurczak","maslo_orz","passata","bataty","cebula","czosnek","imbir","ryz"],
  sp:["Podsmaż kurczaka, cebulę, czosnek i starty imbir.","Dodaj passatę i 3 łyżki masła orzechowego rozmieszane z gorącą wodą.","Wrzuć bataty w kostkę i duś pod przykryciem 25 minut.","Podawaj z ryżem."],
  se:["Brown the chicken with onion, garlic and grated ginger.","Add the passata and 3 spoons of peanut butter loosened with hot water.","Add diced sweet potato and simmer covered for 25 minutes.","Serve with rice."]},
 {id:"tagine",k:600,p:40,pl:"Kurczak po marokańsku z kuskusem",en:"Moroccan chicken with couscous",o:"ma",m:"ld",t:40,s:4,n:["kurczak","ciecierzyca","kuskus","cebula","czosnek","passata","kmin","cynamon"],
  sp:["Podsmaż kurczaka z cebulą i czosnkiem.","Dodaj łyżeczkę kminu i szczyptę cynamonu.","Wlej passatę i odsączoną ciecierzycę, duś 20 minut.","Kuskus zalej wrzątkiem 1:1, przykryj na 5 minut i rozdziel widelcem.","Podawaj gulasz na kuskusie."],
  se:["Brown the chicken with onion and garlic.","Add a teaspoon of cumin and a pinch of cinnamon.","Pour in the passata and drained chickpeas and simmer 20 minutes.","Cover the couscous with the same volume of boiling water for 5 minutes, then fluff.","Serve the stew over couscous."]},
 {id:"misir",k:380,p:18,pl:"Misir wot z soczewicy",en:"Misir wot lentil stew",o:"et",m:"ld",t:40,s:4,n:["soczewica","cebula","czosnek","imbir","passata","berbere"],
  sp:["Zeszklij dużo drobno posiekanej cebuli na oleju, 10 minut.","Dodaj czosnek, imbir i 2 łyżki przyprawy berbere.","Wsyp opłukaną soczewicę, passatę i 3 szklanki wody.","Gotuj 25 minut, aż soczewica się rozpadnie. Podawaj z chlebem lub ryżem."],
  se:["Slowly soften plenty of finely chopped onion in oil, 10 minutes.","Add garlic, ginger and 2 spoons of berbere.","Add the rinsed lentils, passata and 3 cups of water.","Simmer 25 minutes until the lentils break down. Serve with bread or rice."]},
 {id:"sukuma",k:420,p:11,pl:"Sukuma wiki z ugali",en:"Sukuma wiki with ugali",o:"ke",m:"ld",t:30,s:3,n:["jarmuz","pomidory","cebula","mkukurydziana"],
  sp:["Ugali: zagotuj 3 szklanki wody, wsypuj mąkę kukurydzianą, mieszając.","Mieszaj drewnianą łyżką 8 do 10 minut, aż masa odejdzie od garnka.","Podsmaż cebulę, dodaj pomidory i duś 5 minut.","Dodaj posiekany jarmuż i duś do miękkości. Podawaj z ugali."],
  se:["Ugali: boil 3 cups of water and pour in the maize flour while stirring.","Keep stirring with a wooden spoon for 8 to 10 minutes until it pulls away from the pot.","Fry the onion, add tomatoes and cook 5 minutes.","Add the chopped kale and cook until tender. Serve with the ugali."]},
 {id:"golabki",k:520,p:28,pl:"Gołąbki w sosie pomidorowym",en:"Cabbage rolls in tomato sauce",o:"pl",m:"l",t:90,s:4,n:["kapusta", "mielone", "ryz", "cebula", "passata", "ziele"],
  sp:["Sparz główkę kapusty we wrzątku i oddziel 10 do 12 liści.", "Wymieszaj mięso z ugotowanym do połowy ryżem, podsmażoną cebulą, solą i pieprzem.", "Zawiń farsz w liście i ułóż ciasno w garnku.", "Zalej passatą rozcieńczoną szklanką wody, dodaj liść laurowy i ziele angielskie.", "Duś pod przykryciem około 60 minut."],
  se:["Blanch the cabbage head in boiling water and peel off 10 to 12 leaves.", "Mix the mince with half cooked rice, fried onion, salt and pepper.", "Wrap the filling in the leaves and pack them tightly in a pot.", "Pour over passata thinned with a cup of water, add bay leaf and allspice.", "Cover and simmer for about 60 minutes."]},
 {id:"kotlet",k:680,p:34,pl:"Kotlet mielony z ziemniakami i buraczkami",en:"Pork patties with potatoes and beetroot",o:"pl",m:"l",t:45,s:4,n:["mielone", "jajka", "bulka", "cebula", "ziemniaki", "buraki"],
  sp:["Ugotuj buraki i ziemniaki w osobnych garnkach.", "Wymieszaj mięso z jajkiem, startą cebulą, łyżką bułki tartej, solą i pieprzem.", "Uformuj kotlety, obtocz w bułce tartej i smaż po 5 minut z każdej strony.", "Buraki zetrzyj, dopraw solą, odrobiną cukru i octu lub cytryny.", "Podawaj z ziemniakami i buraczkami."],
  se:["Boil the beetroot and potatoes in separate pots.", "Mix the mince with an egg, grated onion, a spoon of breadcrumbs, salt and pepper.", "Shape patties, coat in breadcrumbs and fry 5 minutes per side.", "Grate the beetroot and season with salt, a little sugar and vinegar or lemon.", "Serve with the potatoes and beetroot."]},
 {id:"barszcz",k:150,p:4,pl:"Barszcz czerwony",en:"Red borscht",o:"pl",m:"ld",t:60,s:4,n:["buraki", "marchew", "pietruszka", "czosnek", "bulion", "cytryna", "ziele"],
  sp:["Ugotuj bulion z marchewką, pietruszką, liściem laurowym i zielem angielskim, około 20 minut.", "Dodaj obrane i pokrojone buraki, gotuj 30 minut.", "Wyjmij warzywa, dodaj przeciśnięty czosnek.", "Dopraw sokiem z cytryny, solą, pieprzem i szczyptą cukru.", "Podawaj w kubkach lub z ziemniakami."],
  se:["Simmer stock with carrot, parsley root, bay leaf and allspice for about 20 minutes.", "Add peeled, sliced beetroot and cook 30 minutes.", "Lift out the vegetables and add crushed garlic.", "Season with lemon juice, salt, pepper and a pinch of sugar.", "Serve in mugs or with potatoes."]},
 {id:"rosol",k:380,p:30,pl:"Rosół z makaronem",en:"Chicken noodle soup",o:"pl",m:"l",t:120,s:6,n:["udka", "marchew", "pietruszka", "cebula", "makaron", "natka", "ziele"],
  sp:["Zalej udka 3 litrami zimnej wody i powoli zagotuj, zbierając szumowiny.", "Dodaj marchew, pietruszkę, opaloną nad ogniem cebulę, liść laurowy i ziele angielskie.", "Gotuj na bardzo małym ogniu 90 minut, nie mieszając.", "Ugotuj makaron osobno.", "Podawaj rosół z makaronem, marchewką i natką."],
  se:["Cover the chicken thighs with 3 litres of cold water and bring slowly to a simmer, skimming the foam.", "Add carrot, parsley root, an onion charred over the flame, bay leaf and allspice.", "Cook on the lowest heat for 90 minutes without stirring.", "Cook the noodles separately.", "Serve the broth over noodles with carrot and parsley."]},
 {id:"fasolka",k:560,p:28,pl:"Fasolka po bretońsku",en:"Breton style beans",o:"pl",m:"l",t:40,s:4,n:["fasola", "kielbasa", "boczek", "cebula", "passata", "majeranek", "ppapryka"],
  sp:["Podsmaż pokrojony boczek, kiełbasę i cebulę.", "Dodaj passatę, słodką paprykę i majeranek.", "Wsyp odsączoną fasolę i duś 20 minut.", "Dopraw solą i pieprzem, podawaj z chlebem."],
  se:["Fry the diced bacon, kiełbasa and onion.", "Add the passata, sweet paprika and marjoram.", "Stir in the drained beans and simmer 20 minutes.", "Season with salt and pepper and serve with bread."]},
 {id:"kopytka",k:520,p:12,pl:"Kopytka z masłem i cebulką",en:"Potato dumplings with butter and onion",o:"pl",m:"ld",t:50,s:3,n:["ziemniaki", "maka", "jajka", "maslo", "cebula"],
  sp:["Ugotuj 1 kg ziemniaków i przeciśnij przez praskę.", "Gdy ostygną, dodaj jajko, sól i około 1,5 szklanki mąki, zagnieć gładkie ciasto.", "Uformuj wałki i tnij ukośnie na kopytka.", "Gotuj w osolonej wodzie 2 minuty od wypłynięcia.", "Polej masłem z podsmażoną cebulą."],
  se:["Boil 1 kg potatoes and press them through a ricer.", "When cool, add an egg, salt and about 1.5 cups of flour and knead a smooth dough.", "Roll into ropes and cut diagonally into dumplings.", "Boil in salted water for 2 minutes after they float.", "Top with butter and fried onion."]},
 {id:"leniwe",k:540,p:30,pl:"Pierogi leniwe",en:"Lazy cheese dumplings",o:"pl",m:"ld",t:30,s:3,n:["twarog", "maka", "jajka", "maslo", "cukier", "cynamon"],
  sp:["Rozgnieć twaróg, dodaj jajko, szczyptę soli i około 3/4 szklanki mąki.", "Zagnieć miękkie ciasto, uformuj wałek i pokrój na kawałki.", "Gotuj w osolonej wodzie 2 minuty od wypłynięcia.", "Polej masłem, posyp cukrem i cynamonem."],
  se:["Mash the quark, add an egg, a pinch of salt and about 3/4 cup of flour.", "Knead a soft dough, roll into a log and cut into pieces.", "Boil in salted water for 2 minutes after they float.", "Top with butter, sugar and cinnamon."]},
 {id:"pieczarkowa",k:220,p:6,pl:"Zupa pieczarkowa",en:"Mushroom soup",o:"pl",m:"ld",t:35,s:4,n:["pieczarki", "ziemniaki", "marchew", "cebula", "bulion", "smietana", "koperek"],
  sp:["Podsmaż cebulę i pokrojone pieczarki.", "Dodaj 1,2 l bulionu, ziemniaki i startą marchew, gotuj 20 minut.", "Zahartuj śmietanę i wlej do zupy.", "Dopraw solą i pieprzem, posyp koperkiem."],
  se:["Fry the onion and sliced mushrooms.", "Add 1.2 l stock, the potatoes and grated carrot and simmer 20 minutes.", "Temper the sour cream and stir it in.", "Season with salt and pepper and finish with dill."]},
 {id:"kapusniak",k:330,p:14,pl:"Kapuśniak z kiełbasą",en:"Sauerkraut soup with sausage",o:"pl",m:"l",t:50,s:4,n:["kwaszona", "ziemniaki", "marchew", "kielbasa", "cebula", "bulion", "majeranek"],
  sp:["Podsmaż kiełbasę i cebulę w garnku.", "Dodaj posiekaną kapustę kiszoną i 1,5 l bulionu, gotuj 20 minut.", "Dodaj ziemniaki i marchew, gotuj kolejne 20 minut.", "Dopraw majerankiem, solą i pieprzem."],
  se:["Fry the kiełbasa and onion in a pot.", "Add chopped sauerkraut and 1.5 l stock and simmer 20 minutes.", "Add the potatoes and carrot and cook another 20 minutes.", "Season with marjoram, salt and pepper."]},
 {id:"pastamakrela",k:420,p:30,pl:"Pasta z wędzonej makreli",en:"Smoked mackerel spread on bread",o:"pl",m:"bd",t:10,s:2,n:["makrela", "twarog", "szczypiorek", "kiszone", "chleb"],
  sp:["Obierz makrelę ze skóry i ości.", "Rozgnieć ją widelcem z twarogiem.", "Dodaj posiekany szczypiorek i drobno pokrojonego ogórka kiszonego.", "Dopraw pieprzem i podawaj na chlebie."],
  se:["Remove the skin and bones from the mackerel.", "Mash it with the quark using a fork.", "Add chopped chives and finely diced pickle.", "Season with pepper and spread on bread."]},
 {id:"carbonara",k:720,p:32,pl:"Spaghetti carbonara",en:"Spaghetti carbonara",o:"it",m:"ld",t:20,s:2,n:["makaron", "boczek", "jajka", "grana", "czosnek"],

function applyState(s){

  if(s.aiDish&&typeof s.aiDish==="object"&&typeof s.aiDish.name==="string") st.aiDish=s.aiDish;
  if(Array.isArray(s.saved)) st.saved=s.saved.filter(x=>x&&((x.type==="r"&&RB[x.id])||(x.type==="ai"&&x.d&&typeof x.d.name==="string"&&Array.isArray(x.d.ings)&&Array.isArray(x.d.steps)))).slice(0,100);

  if(Array.isArray(s.promos)) st.promos=s.promos.filter(p=>p&&ING[p.k]&&STORES.includes(p.store)&&Number.isFinite(p.p)&&Number.isFinite(p.until)).filter(p=>p.until>=day0()-30*864e5).slice(-100);
  if(s.mode==="suggest"||(s.mode==="ai"&&st.aiDish)) st.mode=s.mode;
  if(s.shopTicks&&typeof s.shopTicks==="object") st.shopTicks=s.shopTicks;

  if(s.mode==="budget"&&st.budget) st.mode="budget";
  st.batch=!!s.batch; if(s.bought&&typeof s.bought==="object") Object.entries(s.bought).forEach(([k,v])=>{if(ING[k]&&typeof v==="number")st.bought[k]=v});
  if(Array.isArray(s.have)) st.have=new Set(s.have.filter(k=>ING[k]));
  if(Array.isArray(s.plan)&&s.plan.length===7&&s.plan.every(d=>d&&RB[d.b]&&RB[d.l]&&RB[d.d])) st.plan=s.plan;

  if(Number.isFinite(s.ts)) st.ts=s.ts;
}

}

  v.innerHTML=`<p style="margin:0;color:var(--muted);font-size:.92rem;max-width:56ch">${t.shopIntro}</p>
   ${alertHtml(sh.ks)}
   <div class="shopstats">
     <div class="stat"><b>${sh.ks.length}</b><span>${t.toBuyH} · ~${zl(sh.cost)}</span></div>
     <div class="stat"><b>${zl(spent)}</b><span>${t.spent}</span></div>
     <div class="stat"><b>${st.have.size}</b><span>${t.inKitchen}</span></div>
   </div>
   <div class="shopcols">
     <div><p class="label">${t.toBuyH} (${esc(st.store)})</p>
       ${buy?`<ul class="track">${buy}</ul><div class="actions" style="margin-top:10px"><button type="button" class="btn primary" id="shopMode">${t.shopMode}</button><button type="button" class="btn" id="buyall">${t.buyAll}</button><button type="button" class="btn" id="copy">${t.copy}</button><button type="button" class="btn" id="saveImg">${t.saveImg}</button><button type="button" class="btn" id="shareList">${t.shareList}</button></div>`:`<p class="empty">${t.nothingToBuy}</p>`}
     </div>
     <div><p class="label">${t.kitchenH}</p>${kitRows?`<ul class="track">${kitRows}</ul>`:`<p class="empty">${t.emptyKitchen}</p>`}</div>
   </div>
   ${compareHtml(sh.ks)}
   ${pricesBlock}`;
  v.dataset.text=`CoZjem · ${t.list} (${st.store})\n`+whereText(sh.ks)+sh.ks.map(k=>`- ${nmS(k)}  ~${zl(pr(k))}`).join("\n")+`\n${t.total} ${zl(sh.cost)}`;
  expo={title:t.list,items:sh.ks.map(expItem)};
}
function renderView(){ if(st.view==="search"){ renderSearch(); return; } st.view==="week"?renderWeek():st.view==="shop"?renderShop():st.view==="saved"?renderSaved():renderToday(); animateIn(); }
function all(){renderStatic();renderView();}
function flash(){const el=$("result"); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  const top=el.getBoundingClientRect().top; if(top<0||top>window.innerHeight*0.6) el.scrollIntoView({behavior:"smooth",block:"start"});}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.alt||b.dataset.open||((b.dataset.meal||b.dataset.goal)&&st.mode!=="budget")||b.id==="another"||b.id==="backPick"||(b.id==="go"&&st.view!=="week")){ if(st.mode!=="pick"){st.mode="pick"; save();} }
  if(b.dataset.rm!==undefined){st.mine.splice(+b.dataset.rm,1); save(); renderMine(); if(st.view==="today"&&st.mode==="suggest") renderView(); return;}
  if(b.id==="suggest"){ closeSheet();
    if($("mineIn").value.trim()){addMine($("mineIn").value); $("mineIn").value=""; renderMine(); renderChips();}
    st.view="today"; st.mode="suggest"; st.aiErr=null; save(); renderStatic();
    if(!st.mine.length){st.aiErr="empty"; renderView(); flash(); return;}
    if(sampleFn){ askAi(false); } else renderView();
    flash(); return;}
  if(b.dataset.bm){ toggleSave(b.dataset.bm,b.dataset.bmid); const on=b.dataset.bm==="r"?isSavedR(b.dataset.bmid):st.saved.some(x=>x.type==="ai"&&x.d.id===b.dataset.bmid);
    b.setAttribute("aria-pressed",on); b.title=on?L().unsave:L().save; b.querySelector("span").textContent=on?L().savedL:L().save;
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); renderStatic(); return;}
  if(b.dataset.cooked){startCooked(b.dataset.cooked,b.dataset.cid); return;}
  if(b.dataset.cardclose){closeCard(); return;}
  if(b.id==="cardShare"&&card){cardBlob().then(bl=>saveOrShareBlob(bl,cardFileName(),card.info.name,b,true)); return;}
  if(b.id==="cardSave"&&card){cardBlob().then(bl=>saveOrShareBlob(bl,cardFileName(),card.info.name,b,false)); return;}
  if(b.dataset.diary){openDiary(b.dataset.diary); return;}
  if(b.dataset.undiary){photos=photos.filter(p=>p.id!==b.dataset.undiary); savePhotos(); renderView(); return;}
  if(b.dataset.sf!==undefined){ const g=b.dataset.sf, val=b.dataset.sv; if(g==="fl"){ srch.fl.has(val)?srch.fl.delete(val):srch.fl.add(val); } else srch[g]=srch[g]===val?"":val; renderSearch(); return; }
  if(b.dataset.sopen){ const r=RB[b.dataset.sopen]; if(!r) return; st.view="today"; st.mode="pick"; st.forced=r.id; if(!r.m.includes(st.meal)) st.meal=r.m[0]; save(); all(); flash(); return; }
  if(b.id==="srchAi"){ askAiDish(srch.q.trim()); return; }
  if(b.id==="srchStop"){ aiCtl?.abort(); return; }
  if(b.id==="findStoresBtn"){ openStores(); return; }
  if(b.dataset.stclose){ const el=$("storesm"); if(el) el.remove(); return; }
  if(b.id==="geoBtn"){ useMyLocation(); return; }
  if(b.id==="creditsBtn"){ const t=L(); const el=document.createElement("div"); el.className="landing"; el.id="credits";
    el.innerHTML=`<div class="lback" data-ccl="1"></div><div class="lcard credl" role="dialog" aria-modal="true" aria-label="${t.credits}"><p class="lkick">${t.credits}</p><p class="hint" style="margin:0">${t.creditsSub}</p>
      <ul>${R.filter(r=>PHOTOS[r.id]).map(r=>{const p=PHOTOS[r.id]; return `<li><b>${esc(r[st.lang])}</b><span><a href="${p.u}" target="_blank" rel="noopener">${esc(p.a)}</a>, ${esc(p.l)}</span></li>`;}).join("")}</ul>
      <button type="button" class="btn" data-ccl="1">${t.close}</button></div>`; document.body.appendChild(el); return; }
  if(b.dataset.ccl){ const el=$("credits"); if(el) el.remove(); return; }
  if(b.id==="saveImg"){exportListImage(b); return;}
  if(b.id==="shopMode"){openShop(listFromExpo()); return;}
  if(b.id==="shareList"||b.id==="shareList2"){shareCurrentList(b); return;}
  if(b.dataset.stick){tickItem(b.dataset.stick); return;}
  if(b.id==="shopClose"){closeShop(false); return;}
  if(b.id==="shopDone"){finishShop(); return;}
  if(b.id==="landGo"){closeLanding(true); return;}
  if(b.dataset.lclose){closeLanding(false); return;}
  if(b.id==="acctBtn"){const box=$("acct"); box.hidden=!box.hidden; b.setAttribute("aria-expanded",!box.hidden); cloud.confirmDel=false; renderAcct(); if(!box.hidden){const i=$("acctEmail"); if(i) i.focus();} return;}
  if(b.id==="syncNow"){pullMerge(); return;}
  if(b.id==="signOut"){cloud.sb.auth.signOut().then(()=>{cloud.last=null; renderAcct();}); return;}
  if(b.id==="delCloud"){ if(!cloud.confirmDel){cloud.confirmDel=true; renderAcct(); return;}
    cloud.confirmDel=false; cloud.sb.from("user_state").delete().eq("user_id",cloud.user.id).then(({error})=>{ if(error){cloud.status="error"; renderAcct(); return;} cloud.sb.auth.signOut().then(()=>{cloud.last=null; renderAcct();}); }); return;}
  if(b.dataset.share){openShare(b); return;}
  if(b.id==="shNative"&&shareCur){ const d=shareCur.noLink?{title:shareCur.title,text:shareCur.full}:{title:shareCur.title,text:shareCur.text,url:shareCur.url};
    try{ navigator.share(d).catch(()=>{}); }catch(e){} return; }
  if(b.id==="shLink"&&shareCur){copyText(shareCur.url,$("shNote"),L().shCopiedLink); return;}
  if(b.id==="shText"&&shareCur){copyText(shareCur.full,$("shNote"),L().shCopiedText); return;}
  if(b.dataset.setstore){st.store=b.dataset.setstore; save(); all(); renderStoresModal(); flash(); return;}
  if(b.dataset.rmpromo!==undefined){st.promos.splice(+b.dataset.rmpromo,1); save(); renderView(); return;}
  if(b.dataset.rmprice){const [k,sx]=b.dataset.rmprice.split("|"); if(st.prices[k]){delete st.prices[k][sx]; if(!Object.keys(st.prices[k]).length) delete st.prices[k];} save(); renderView(); return;}
  if(b.dataset.unsave!==undefined){st.saved.splice(+b.dataset.unsave,1); save(); renderStatic(); renderView(); return;}
  if(b.dataset.opensaved!==undefined){const x=st.saved[+b.dataset.opensaved]; if(!x) return;
    st.view="today";
    if(x.type==="r"){ st.mode="pick"; st.forced=x.id; const r=RB[x.id]; if(!r.m.includes(st.meal)) st.meal=r.m[0]; }
    else { st.aiDish=JSON.parse(JSON.stringify(x.d)); st.mode="ai"; }
    save(); all(); flash(); return;}
  if(b.id==="backSaved"){st.view="saved"; st.mode="pick"; save(); all(); return;}
  if(b.id==="aiAgain"){askAi(true); return;}
  if(b.id==="aiRetry"){askAi(false); return;}
  if(b.id==="aiStop"){aiCtl?.abort(); return;}
  if(b.id==="backPick"){st.forced=null; renderView(); flash(); return;}
  if(b.dataset.aiing!==undefined&&st.aiDish){const i=st.aiDish.ings[+b.dataset.aiing]; if(i){i.have=!i.have; save(); renderToday(true);} return;}
  if(b.dataset.goal){st.goal=b.dataset.goal;st.pick=0;st.forced=null;genWeek();save();all();return;}
  if(b.dataset.meal){st.meal=b.dataset.meal;st.pick=0;st.forced=null;save();all();return;}
  if(b.dataset.store){st.store=b.dataset.store;save();all();return;}
  if(b.dataset.ing){const k=b.dataset.ing;
    if(st.have.has(k)){st.have.delete(k); delete st.bought[k];} else st.have.add(k);
    document.querySelectorAll(`#cats [data-ing="${k}"]`).forEach(c=>c.setAttribute("aria-pressed",st.have.has(k)));
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    $("count").textContent=L().count(st.have.size); renderToolbar(); save();
    if(st.view==="today"){ if(st.cur) st.forced=st.cur; renderToday(true); }
    else if(st.view==="week") renderWeek(); else renderShop();
    return;}
  if(b.dataset.alt){st.forced=b.dataset.alt; renderView(); flash(); return;}
  if(b.dataset.open){st.forced=b.dataset.open; st.meal=b.dataset.om; st.view="today"; save(); all(); flash(); return;}
  if(b.dataset.buy){const k=b.dataset.buy; st.have.add(k); st.bought[k]=Date.now(); save(); renderChips(); renderView(); return;}
  if(b.dataset.used){const k=b.dataset.used; st.have.delete(k); delete st.bought[k]; save(); renderChips(); renderView(); return;}
  if(b.id==="buyall"){const now=Date.now(); weekShop().ks.forEach(k=>{st.have.add(k); st.bought[k]=now}); save(); renderChips(); renderView(); flash(); return;}
  if(b.id==="batch"){st.batch=!st.batch; genWeek(); save(); renderView(); flash(); return;}
  if(b.dataset.swap){const [d,m]=b.dataset.swap.split(":"); swapCell(+d,m); renderView(); return;}
  if(b.id==="lang-pl"||b.id==="lang-en"){st.lang=b.id.slice(5);save();all();return;}
  if(b.id==="tab-today"||b.id==="tab-week"||b.id==="tab-shop"||b.id==="tab-saved"||b.id==="tab-search"){st.view=b.id.slice(4);save();closeSheet();all();
    window.scrollTo({top:0,behavior:"smooth"});
    if(st.view==="search"&&window.matchMedia("(min-width:901px)").matches){ const i=$("srchQ"); if(i) i.focus({preventScroll:true}); }
    return;}
  if(b.dataset.sheet){ openSheet(b.dataset.sheet); return; }
  if(b.dataset.sheetclose){ closeSheet(); return; }
  if(b.dataset.bscope){ st.budgetScope=b.dataset.bscope; renderBudgetBox(); return; }
  if(b.id==="budClear"){ st.budget=null; if(st.mode==="budget") st.mode="pick"; save(); all(); return; }
  if(b.id==="budExit"){ st.mode="pick"; save(); all(); return; }
  if(b.id==="budReplan"&&st.budget){ genWeekBudget(st.budget.amt); renderView(); flash(); return; }
  if(b.id==="clear"){st.have.clear();st.q="";$("q").value="";st.pick=0;st.forced=null;save();all();return;}
  if(b.id==="another"){
    if(st.forced){const list=ranked(); const j=list.findIndex(a=>a.r.id===st.forced); st.pick=j<0?0:j+1; st.forced=null;} else st.pick++;
    renderView(); flash(); return;}
  if(b.id==="regen"){genWeek(); renderView(); flash(); return;}
  if(b.id==="go"){ closeSheet(); if(st.mode==="budget"){ st.mode="pick"; }
    if(st.view==="week"){genWeek(); renderView(); flash(); return;}
    if(st.view==="shop"){st.view="today"; save(); renderStatic();}
    const list=ranked(); if(!list.length){renderToday();return;}
    const pool=Math.min(4,list.length); const cur=st.forced?list.findIndex(a=>a.r.id===st.forced):st.pick%list.length;
    let n=Math.floor(Math.random()*pool); if(pool>1&&n===cur) n=(n+1)%pool;
    st.pick=n; st.forced=null; renderView(); flash(); return;}
  if(b.id==="copy"){const txt=$("view").dataset.text||"";
    const ok=()=>{b.textContent=L().copied;setTimeout(()=>{b.textContent=L().copy},1500)};
    try{navigator.clipboard.writeText(txt).then(ok).catch(()=>fallback(txt,ok));}catch(err){fallback(txt,ok);} }
});
function fallback(txt,ok){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}ta.remove();}
$("q").addEventListener("input",e=>{st.q=e.target.value;renderChips();});
$("photoIn").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; onPhoto(f); });
document.addEventListener("submit",e=>{
  if(e.target.id==="budgetForm"){ e.preventDefault(); const amt=Math.round(parseFloat(String($("budgetIn").value).replace(",","."))*100)/100;
    if(!Number.isFinite(amt)||amt<=0||amt>5000){ $("budHint").textContent=L().budBad; return; }
    const scope=st.budgetScope||(st.budget&&st.budget.scope)||"meal"; st.budget={amt,scope}; closeSheet();
    if(scope==="week"){ st.view="week"; genWeekBudget(amt); } else { st.view="today"; st.mode="budget"; }
    save(); all(); window.scrollTo({top:0,behavior:"smooth"}); flash(); return; }
  if(e.target.id==="addrForm"){e.preventDefault(); nearState.q=$("addrIn").value; geocode(nearState.q); return;}
  if(e.target.id==="emailForm"){e.preventDefault(); sendLink(($("acctEmail").value||"").trim()); return;}
  if(e.target.id==="codeForm"){e.preventDefault(); const c=($("acctCode").value||"").replace(/\D/g,""); if(c.length===6) verifyCode(c); return;}
  if(e.target.id!=="priceForm") return; e.preventDefault(); const t=L();
  const raw=$("pfItem").value.trim(), k=findKey(raw), p=Math.round(parseFloat(String($("pfPrice").value).replace(",","."))*100)/100, store=$("pfStore").value;
  const err=m=>{$("pfErr").textContent=m;};
  if(!k||ING[k][3]==="afr") return err(t.pfErrItem);
  if(!Number.isFinite(p)||p<=0||p>1000) return err(t.pfErrPrice);
  if($("pfPromo").checked){ const u=new Date($("pfUntil").value+"T23:59:00").getTime(); if(!Number.isFinite(u)||u<day0()) return err(t.pfErrDate);
    st.promos.push({k,store,p,until:u,ts:Date.now()}); }
  else (st.prices[k]=st.prices[k]||{})[store]={p,ts:Date.now()};
  save(); renderView(); flash();
});
$("mineForm").addEventListener("submit",e=>{e.preventDefault(); const v=$("mineIn").value; if(!v.trim()) return;
  addMine(v); $("mineIn").value=""; save(); renderMine(); renderChips(); $("count").textContent=L().count(st.have.size); renderToolbar();
  const last=$("mine").lastElementChild; if(last){last.classList.add("pop");}
  if(st.view==="today"&&st.mode==="suggest") renderView(); });
try{ const p=window.claude?.use?.("sample"); if(p&&p.then) p.then(f=>{sampleFn=f||false; renderMine(); if(st.view==="today"&&st.mode==="suggest") renderView();}).catch(()=>{sampleFn=false; renderMine();}); else sampleFn=false; }catch(e){ sampleFn=false; }
if(!st.plan) genWeek();
cloudInit();

  st.view="today"; st.mode="pick"; st.forced=r.id; st.sharedIn=r.id; if(!r.m.includes(st.meal)) st.meal=r.m[0]; } })();
all();
if(st.sharedIn) showLanding(st.sharedIn);
openFromHash();

  if(m&&RB[m[1]]){ const r=RB[m[1]]; const old=$("landing"); if(old) old.remove();
